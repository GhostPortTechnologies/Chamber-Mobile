name: Private test build (draft release)
description: Puts the APK in a draft release, one per branch, replaced on every build. Drafts are visible only to people who can push to the repo. A failure is posted as annotations, which show without signing in.
inputs:
  prefix:
    description: tag prefix, e.g. test or native
    required: true
  apk:
    description: path of the built APK
    required: true
  title:
    description: release title
    required: true
  notes:
    description: release notes
    required: true
  token:
    description: token with contents:write
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PREFIX: ${{ inputs.prefix }}
        SRC_APK: ${{ inputs.apk }}
        TITLE: ${{ inputs.title }}
        NOTES: ${{ inputs.notes }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        set -euo pipefail
        ERR="$RUNNER_TEMP/release-$PREFIX.err"; : > "$ERR"
        report() { echo "::error::Saving the draft release failed. What gh said:"; tail -20 "$ERR" | sed 's/^/::error::/'; }
        trap report ERR
        TAG="$PREFIX-$(echo "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
        # The commit is in the file name: replacing a file in place (--clobber) deletes the old one first, and GitHub
        # has answered that delete with HTTP 500. A new name never needs a delete to succeed.
        NAME="chamber-$TAG-${GITHUB_SHA::7}.apk"
        cp "$SRC_APK" "$NAME"
        NOTES="$NOTES Newest file: $NAME"
        if DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>>"$ERR"); then
          if [ "$DRAFT" != "true" ]; then echo "::warning::$TAG is already public, so this build was not uploaded to it."; exit 0; fi
          gh release edit "$TAG" --notes "$NOTES" 2>>"$ERR"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>>"$ERR" || true)
          if ! grep -qx "$NAME" <<<"$ASSETS"; then gh release upload "$TAG" "$NAME" 2>>"$ERR"; fi   # a re-run of the same commit is already there
          # Older builds go, but GitHub refusing a delete must not fail the build: the newest file is what matters.
          for old in $(grep -vx "$NAME" <<<"$ASSETS" || true); do
            gh release delete-asset "$TAG" "$old" -y 2>>"$ERR" || echo "::warning::Couldn't remove the older $old from $TAG (GitHub said no). Harmless: the newest is $NAME."
          done
        else
          gh release create "$TAG" "$NAME" --draft --prerelease --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" 2>>"$ERR"
        fi
        echo "::notice::Private test build saved as draft release $TAG. Signed in to GitHub, open https://github.com/$GITHUB_REPOSITORY/releases and tap $NAME"
