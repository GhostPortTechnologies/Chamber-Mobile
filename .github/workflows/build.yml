name: Build

# Pushes to main and feature branches, and every pull request, run the tests, build an Android test app and check
# that the iOS project compiles. A test app goes to a DRAFT release, which only people who can push to this repo see.
# Nothing is made public here: that takes the owner's "ship it". Store builds come later (T-0323).

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (debug APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only for the draft test-build release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npx cap sync android
      - name: Firebase config (if the secret is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON is not set: this build works, but push stays off."
          fi
      - name: Stable test signing key (if the secret is set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/test-signing.keystore"
            echo "ANDROID_TEST_KEYSTORE_FILE=$RUNNER_TEMP/test-signing.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_TEST_KEYSTORE_B64 is not set: this APK uses a one-off key and won't install over an earlier test build (uninstall first)."
          fi
      - name: Build debug APK
        working-directory: android
        shell: bash
        env:
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee gradle-build.log
      - name: Signing fingerprint (to check the CI key is the expected one)
        if: success()
        shell: bash
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          FP=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "::notice::APK signing SHA-256: ${FP:-unknown}"
      - name: Report the Gradle error
        if: failure()
        working-directory: android
        shell: bash
        run: |
          # Turn the important lines into annotations, which show on the PR and through the public API.
          grep -E -A12 "What went wrong|^e: |error:| FAILED|Could not|FAILURE" gradle-build.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
      # No artifact: on a public repo anyone signed in to GitHub could download it. A draft release is private.
      # One per branch, replaced on every build. Skipped for PRs from forks, which get a read-only token.
      - name: Save the private test build (draft release)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          TAG="test-$(echo "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          APK="chamber-${TAG}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          NOTES="Test build of branch ${BRANCH} (commit ${GITHUB_SHA::7}). Debug build for testing only, not for the store. Install: tap ${APK} below. See docs/SOP.md section 3."
          if DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$DRAFT" != "true" ]; then
              echo "::warning::$TAG is already public, so this build was not uploaded to it."
              exit 0
            fi
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --draft --prerelease --target "$GITHUB_SHA" --title "Test build: ${BRANCH}" --notes "$NOTES"
          fi
          echo "::notice::Private test build saved as a draft. Signed in to GitHub, open https://github.com/${GITHUB_REPOSITORY}/releases and tap ${APK}"

  native-android:
    name: Native Android (Kotlin, T-0358)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only for the draft test-build release
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Stable test signing key (if the secret is set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/test-signing.keystore"
            echo "ANDROID_TEST_KEYSTORE_FILE=$RUNNER_TEMP/test-signing.keystore" >> "$GITHUB_ENV"
          fi
      - name: Tests and debug APK
        env:
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log
      - name: Signing fingerprint (to check the CI key is the expected one)
        if: success()
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null | head -1)
          FP=$(keytool -printcert -jarfile "$APK" 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: *//')
          echo "::notice::APK signing SHA-256: ${FP:-unknown}"
      - name: Report the Gradle error
        if: failure()
        run: |
          grep -E -A12 "What went wrong|^e: |error:| FAILED" build.log | head -60 | while IFS= read -r l; do echo "::error::${l}"; done
      - name: Save the private test build (draft release)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          TAG="native-$(echo "$BRANCH" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          APK="chamber-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          NOTES="Native app test build of ${BRANCH} (commit ${GITHUB_SHA::7}). Installs as 'Chamber' (dev) next to the current app. Testing only."
          if DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            [ "$DRAFT" = "true" ] || { echo "::warning::$TAG is public, so this build was not uploaded."; exit 0; }
            gh release edit "$TAG" --notes "$NOTES"
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --draft --prerelease --target "$GITHUB_SHA" --title "Native test build: ${BRANCH}" --notes "$NOTES"
          fi
          echo "::notice::Private native test build saved as draft release $TAG"

  ios:
    name: iOS (simulator build, unsigned)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the iOS simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
